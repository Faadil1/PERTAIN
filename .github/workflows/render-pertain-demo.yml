name: Render PERTAIN Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'demo-video/src/**'
      - 'demo-video/capture.mjs'
      - 'demo-video/package.json'
      - 'demo-video/voiceover.txt'
      - '.github/workflows/render-pertain-demo.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Remotion dependencies
        working-directory: demo-video
        run: npm install

      - name: Install Chromium
        working-directory: demo-video
        run: npx playwright install --with-deps chromium

      - name: Generate final voiceover
        working-directory: demo-video
        run: |
          python -m pip install --quiet edge-tts
          mkdir -p public
          edge-tts --voice en-US-GuyNeural --rate=+8% --file voiceover.txt --write-media public/voiceover.mp3
          test -s public/voiceover.mp3

      - name: Capture live Cloudflare product
        working-directory: demo-video
        env:
          PERTAIN_URL: https://pertain.faadil-casecraft.workers.dev/
        run: npm run capture

      - name: Render Remotion demo
        working-directory: demo-video
        run: |
          mkdir -p out
          npm run render
          test -s out/pertain-demo.mp4

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: pertain-demo-video
          path: demo-video/out/pertain-demo.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Publish rendered MP4 to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f demo-video/out/pertain-demo.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'demo: publish synchronized Remotion video [skip ci]'
          git push
